# ==============================================================================
# Configuración del Sistema de Respaldo Rotatorio ATLAS
# ==============================================================================

# Directorio a respaldar (Origen)
DIR_ORIGEN="$HOME/proyecto_atlas"

# Directorio donde se guardarán las copias (Destino)
DIR_DESTINO="$HOME/backups-rotatorios-atlas/backups"

# Archivo de registro de eventos
LOG_FILE="$HOME/backups-rotatorios-atlas/logs/ejecucion.log"

# Política de retención (Eliminar respaldos con más de N días)
DIAS_RETENCION=7

# Umbral crítico de uso de disco en % antes de abortar el backup
UMBRAL_DISCO_MAX=90
